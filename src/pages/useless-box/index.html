<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Useless Box</title>
    <style>
      body {
        --wood-bg-image: url('/useless-box/images/wood.png');
        --dark-wood-bg-image: url('/useless-box/images/dark-wood.png');
        --wood-bg-color: #c4a484;
        --wood-bg-color-dark: rgb(172, 141, 112);

        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: white;
      }

      .wood-texture {
        background-color: var(--wood-bg-color);
        background-image: var(--wood-bg-image);
        border: 1px solid rgba(0, 0, 0, 0.15);
      }

      .box-container {
        width: 300px;
        display: flex;
        flex-direction: column;
        position: relative;

        --depth: 30px;
        border-radius: 0 var(--depth);
        corner-shape: bevel;
        border-right: var(--depth) solid var(--wood-bg-color-dark);
        border-bottom: var(--depth) solid var(--wood-bg-color-dark);

        box-shadow: 2px 2px 4px 0px rgba(0, 0, 0, 0.4);

        /* Inside the box */
        background-image: var(--dark-wood-bg-image);
      }

      .box-container--green {
        background-color: rgba(0, 123, 0, 0.95);
      }

      .box-container--red {
        background-color: rgba(123, 0, 0, 0.95);
      }

      .box-top {
        height: 200px;
        box-shadow: 0 10px 10px -10px rgba(0, 0, 0, 0.5);

        transform: rotateX(0);
        transform-origin: top center;
        transition: transform 0.6s ease;
        z-index: 1;
      }

      .box-top--open {
        transform: rotateX(35deg);
      }

      .box-bottom {
        height: 240px;
        display: flex;
        justify-content: center;
        z-index: 0;
      }

      #switch {
        height: 64px;
        margin-top: 24px;
        cursor: pointer;

        &.switch--on {
          cursor: default;
        }
      }

      .hand-container {
        position: absolute;
        top: 30px;
        left: 70px;
        height: 175px;
        width: auto;
      }

      .hand-container--moving {
        animation:
          hand-move-down 1s ease-in-out forwards,
          hand-move-up 1s linear forwards 1s;
      }

      .hand {
        height: 100%;
      }

      @keyframes hand-move-down {
        0% {
          transform: translateY(0);
        }

        100% {
          transform: translateY(65px);
        }
      }

      @keyframes hand-move-up {
        0% {
          transform: translateY(65px);
        }

        100% {
          transform: translateY(0px);
        }
      }
    </style>
  </head>
  <body>
    <div class="box-container box-container--green">
      <div class="box-top wood-texture"></div>
      <div class="box-bottom wood-texture">
        <img id="switch" src="/useless-box/images/off.png" alt="Toggle switch" />
      </div>

      <div class="hand-container">
        <img class="hand" src="/useless-box/images/robot-hand.png" alt="Hand" />
      </div>
    </div>

    <script>
      function triggerHandAnimation({ onHandMoveDownEnd, onHandMoveUpEnd }) {
        const handContainer = document.querySelector('.hand-container');
        handContainer.classList.add('hand-container--moving');

        handContainer.addEventListener('animationend', ({ animationName }) => {
          if (animationName === 'hand-move-down') {
            onHandMoveDownEnd();
          }

          if (animationName === 'hand-move-up') {
            handContainer.classList.remove('hand-container--moving');
            onHandMoveUpEnd();
          }
        });
      }

      function toggleSwitchUi(on) {
        const toggleSwitch = document.getElementById('switch');
        toggleSwitch.src = `/useless-box/images/${on ? 'on' : 'off'}.png`;
        toggleSwitch.classList.toggle('switch--on', on);
      }

      function setupToggleSwitch() {
        // Elements
        const boxContainer = document.querySelector('.box-container');
        const boxTop = document.querySelector('.box-top');
        const toggleSwitch = document.getElementById('switch');

        let toggleSwitchOn = false;

        toggleSwitch.addEventListener('click', () => {
          if (toggleSwitchOn) {
            return;
          }

          toggleSwitchOn = !toggleSwitchOn;

          boxTop.classList.add('box-top--open');

          toggleSwitchUi(toggleSwitchOn);

          if (toggleSwitchOn) {
            setTimeout(() => {
              triggerHandAnimation({
                // Switch is clicked
                onHandMoveDownEnd: () => {
                  toggleSwitchOn = false;
                  toggleSwitchUi(toggleSwitchOn);
                  boxContainer.classList.add('box-container--red');
                },

                // Hand moves back inside box
                onHandMoveUpEnd: () => {
                  boxTop.classList.remove('box-top--open');

                  // FIXME: Remove once transition ends
                  setTimeout(() => {
                    boxContainer.classList.remove('box-container--red');
                  }, 500);
                },
              });
            }, 200);
          }
        });
      }

      setupToggleSwitch();
    </script>
  </body>
</html>
